name: .NET build, test, and publish

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet sources
        run: |
          mkdir -p packages
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github-packages \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore Glacier.Polaris.slnx

      - name: Build
        run: dotnet build Glacier.Polaris.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Glacier.Polaris.Tests/Glacier.Polaris.Tests.csproj --configuration Release --no-restore --no-build --blame-hang --blame-hang-dump-type none --blame-hang-timeout 60s

      - name: Pack Glacier.Polaris
        run: dotnet pack src/Glacier.Polaris/Glacier.Polaris.csproj --configuration Release --no-build --output packages

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source github-packages --skip-duplicate

      - name: Authenticate with NuGet Trusted Publishing (OIDC)
        id: login
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: NuGet/login@v1
        continue-on-error: true
        with:
          user: spuriousbugfix

      - name: Publish to nuget.org
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          OIDC_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          FALLBACK_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          EFFECTIVE_KEY="${OIDC_API_KEY:-$FALLBACK_API_KEY}"
          if [ -z "$EFFECTIVE_KEY" ]; then
            echo "::error::Neither NuGet OIDC Trusted Publishing token nor NUGET_API_KEY secret is available."
            exit 1
          fi
          dotnet nuget push "packages/*.nupkg" --api-key "$EFFECTIVE_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.nupkg
          generate_release_notes: true
